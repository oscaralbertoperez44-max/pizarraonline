<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MathBoard Pro — Pizarra Matemática Profesional</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
    <style>
        /* Base General Ultra Optimizada - Bloqueo de Gestos de SO */
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; color: #1e293b;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            position: fixed; inset: 0; 
            touch-action: none; -ms-touch-action: none;
            user-select: none; -webkit-user-select: none;
            overscroll-behavior: none;
        }
        
        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            overflow: hidden; 
            background-color: #ffffff;
        }

        canvas#board {
            display: block; touch-action: none;
            width: 100vw; height: 100vh; 
            background-color: #ffffff;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: contents;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="%2394a3b8" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" fill="%233b82f6"/></svg>') 12 12, crosshair !important;
        }

        .remote-cursor {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 9997;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.1s linear; opacity: 0; transform-origin: top left;
            margin-left: -5px; margin-top: -5px; will-change: transform;
        }
        .remote-cursor .cursor-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
        .remote-cursor .cursor-label {
            margin-top: 4px; color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 0.5px;
        }

        #login-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 10, 0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); transition: opacity 0.5s; }
        .login-box { background: #1a1a1a; color: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.8); border: 1px solid #333; text-align: center; width: 90%; max-width: 380px; }
        .login-title { font-size: 2rem; margin-bottom: 5px; font-weight: bold; }
        .login-subtitle { color: #888; margin-bottom: 25px; font-size: 0.9rem; }
        .role-btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.3s; border: none; }
        .btn-student { background: #2563eb; color: white; }
        .btn-student:hover { background: #1d4ed8; }
        .btn-teacher { background: #10b981; color: white; }
        .btn-teacher:hover { background: #059669; }
        .auth-form { display: none; margin-top: 15px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; font-size: 1.2rem; text-align: center; box-sizing: border-box; text-transform: uppercase; letter-spacing: 2px; }
        .auth-input:focus { outline: 2px solid #3b82f6; }
        .back-btn { background: transparent; color: #888; font-size: 0.9rem; margin-top: 10px; padding: 5px; border: none; cursor: pointer; }
        .back-btn:hover { color: white; }
        
        #ui-panel, #main-toolbar { display: none; }

        .floating-panel { position: absolute; background: rgba(30, 30, 30, 0.95); color: #fff; border-radius: 12px; border: 1px solid #444; z-index: 10; box-shadow: 0 8px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; transition: width 0.2s, height 0.2s, top 0.2s, left 0.2s; }
        .floating-panel.dragging { transition: none; }
        .panel-header { background: #222; padding: 8px 10px; cursor: move; font-weight: bold; border-top-left-radius: 12px; border-top-right-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; user-select: none;}
        .panel-controls-header button { padding: 2px 8px; font-size: 1rem; background: transparent; color: #888; border: none; cursor: pointer; transition: 0.2s; }
        .panel-controls-header button:hover { color: #fff; }
        
        #ui-panel { top: 20px; left: 20px; padding: 20px; text-align: center; background: rgba(15, 23, 42, 0.95); border: 1px solid #3b82f6; border-radius: 16px; transition: opacity 1s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        #pdf-panel, #dola-panel, #calc-panel, #gallery-panel { top: 60px; left: 30px; width: 550px; display: none; max-height: 90vh; position: relative; }
        #pdf-render-container, #dola-render-container, #calc-render-container { position: relative; overflow: auto; background: #525659; padding: 10px; display: flex; justify-content: center; align-items: flex-start; flex-grow: 1; min-height: 200px; }
        #pdf-canvas { box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: white; max-width: 100%; }
        
        #dola-panel { width: 750px; height: 550px; }
        #calc-panel { width: 600px; height: 500px; }
        
        .pdf-controls { padding: 8px; display: flex; justify-content: space-between; align-items: center; background:#1f1f1f; border-bottom: 1px solid #333; gap: 8px; flex-wrap: wrap; }
        .pdf-controls-group { display: flex; align-items: center; gap: 5px; background: #111; padding: 4px; border-radius: 5px; }
        
        #formulas-panel { top: 80px; right: 30px; width: 480px; display: none; max-height: 85vh; overflow: hidden; }
        .formula-tab-btns { display: flex; background: #111; overflow-x: auto; scroll-behavior: smooth; }
        .formula-tab-btns::-webkit-scrollbar { height: 4px; }
        .formula-tab-btns::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .f-tab { background: transparent; border: none; color: #888; padding: 12px 14px; cursor: pointer; font-weight: bold; font-size: 0.85rem; border-bottom: 2px solid transparent; white-space: nowrap; }
        .f-tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; background: #1a1a1a; }
        .formula-grid { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 15px; overflow-y: auto; max-height: 60vh; background: #1a1a1a; }
        
        /* Motor de Recorte Seguro Libre de Bugs */
        #crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; display: none; z-index: 5; background: rgba(0,0,0,0.3); }
        #crop-box { position: absolute; border: 2px dashed #3b82f6; background: rgba(59,130,246,0.25); pointer-events: none; display: none; }
        
        #stamper { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 80; touch-action: none; background: transparent; border: none; box-shadow: none; }
        #stamper-header { background: rgba(15, 23, 42, 0.95); padding: 8px; cursor: move; text-align: center; border-radius: 12px 12px 0 0; border: 1px solid #3b82f6; border-bottom: none; font-weight: bold; font-size: 0.85rem; color: #60a5fa; }
        #stamper-content { position: relative; border: 3px dashed #10b981; background: transparent; box-shadow: 0 15px 40px rgba(0,0,0,0.6); min-width: 100px; min-height: 50px; border-radius: 0 0 12px 12px; }
        
        #stamp-crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; display: none; z-index: 10; background: rgba(0,0,0,0.3); border-radius: 0 0 9px 9px;}
        #stamp-crop-box { position: absolute; border: 2px dashed #3b82f6; background: rgba(59,130,246,0.3); pointer-events: none; display: none; }

        #stamp-img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; border-radius: 0 0 9px 9px; -webkit-user-drag: none;}
        .resize-handle { position: absolute; right: -12px; bottom: -12px; width: 30px; height: 30px; background: #3b82f6; border-radius: 50%; border: 3px solid white; cursor: nwse-resize; box-shadow: 0 3px 12px rgba(0,0,0,0.6); z-index: 21; touch-action: none; }
        .resize-handle:hover { transform: scale(1.1); background: #2563eb; }
        .resize-handle-pdf { right: 5px; bottom: 5px; border: 2px solid white; }
        
        .stamper-toolbar { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 12px; display: flex; gap: 6px; background: rgba(30,30,30,0.97); padding: 6px 9px; border-radius: 20px; border: 1px solid #555; white-space: nowrap; z-index: 50; }
        
        button { background: #2563eb; color: white; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85rem;}
        button:hover { background: #1d4ed8; }
        .danger-btn { background: #dc2626 !important; color: #fff; }
        .record-active { background: #dc2626 !important; animation: pulse-record 1.5s infinite; }
        @keyframes pulse-record { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .hidden-file { display: none; }
        #formula-search { margin: 10px 15px 0; width: calc(100% - 30px); box-sizing: border-box; padding: 10px 12px; border: 1px solid #3a3a3a; border-radius: 8px; background: #101010; color: #fff; outline: none; font-size: .9rem; }
        #formula-search:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.15); }
        .formula-count { padding: 6px 15px 0; color: #777; font-size: .7rem; text-align: right; }
        
        .formula-category-selector{ display:flex;flex-wrap:wrap;gap:5px;padding:5px 0;max-height:105px;overflow-y:auto; }
        .formula-category-selector .f-cat{ border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 9px; cursor:pointer;background:rgba(255,255,255,.05);color:inherit;font-size:.78rem; }
        .formula-category-selector .f-cat.active{outline:2px solid rgba(139,92,246,.7);background:rgba(139,92,246,.22);}
        #formula-grid-container{display:grid;grid-template-columns:1fr;gap:8px;padding-bottom:10px;}
        .formula-card{padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.045);}
        .formula-card-title{font-weight:700;font-size:.84rem;margin-bottom:5px;}
        .formula-card-eq{font-family:"Cambria Math","Times New Roman",serif;font-size:1.02rem;line-height:1.35;word-break:break-word;}
        .formula-card-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
        .formula-card-actions button{border:0;border-radius:7px;padding:5px 7px;cursor:pointer;font-size:.72rem;background:rgba(255,255,255,.09);color:inherit;}
        
        #formulas-panel{overscroll-behavior:contain;}
        #formula-grid-container{max-height:43vh;overflow-y:auto;padding-right:3px;}

        /* Estilo de la Galería de Ejercicios Guardados PERMANENTE */
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; height: 100%; max-height: 55vh; overflow-y: auto; background: #1a1a1a; }
        .gallery-item { background: #2a2a2a; border-radius: 8px; padding: 8px; text-align: center; border: 1px solid #444; display: flex; flex-direction: column; justify-content: space-between; }
        .gallery-item img { max-width: 100%; height: 80px; object-fit: contain; background: #fff; border-radius: 4px; display: block; margin: 0 auto 8px; pointer-events: none;}

        /* === BARRA UNIFICADA - Zona Segura Inferior === */
        #main-toolbar {
            position: fixed; bottom: 25px; 
            left: 50%; transform: translateX(-50%);
            z-index: 9999; gap: 8px; padding: 8px 16px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            align-items: center; backdrop-filter: blur(12px);
            max-width: 95vw; overflow-x: auto; white-space: nowrap;
        }
        #main-toolbar::-webkit-scrollbar { display: none; }
        .toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 4px; flex-shrink: 0; }
        #main-toolbar button { min-width: 44px; min-height: 42px; border: 0; border-radius: 12px; padding: 6px 12px; font-size: 16px; color: #fff; background: #334155; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        #main-toolbar button:hover { background: #475569; }
        #main-toolbar button.active { outline: 2px solid #3b82f6; background: #2563eb; }
        #main-toolbar input[type="range"] { width: 90px; cursor: pointer; accent-color: #3b82f6; flex-shrink: 0;}
        #main-toolbar input[type="color"] { width: 38px; height: 38px; border: 0; padding: 0; border-radius: 10px; background: transparent; cursor: pointer; flex-shrink: 0;}
        
        .audio-unlock-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000;
            padding: 20px 30px; font-size: 1.2rem; font-weight: bold; background: #2563eb; color: #fff;
            border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: pointer;
            animation: pulseAudio 2s infinite;
        }
        @keyframes pulseAudio { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); } }

        @media (max-width: 900px) {
            #formulas-panel { width: 92vw !important; max-height:66vh !important; }
            #pdf-panel, #dola-panel, #calc-panel, #gallery-panel { width: 95%; left: 2.5%; top: 5%; }
            #main-toolbar { padding: 6px 12px; bottom: 15px; border-radius: 20px;}
            #main-toolbar button { min-width: 36px; min-height: 36px; padding: 4px 8px; font-size: 15px; }
            .hide-mobile { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <div class="login-title">📐 MathBoard Pro</div>
            <div class="login-subtitle" id="login-msg">Selecciona tu perfil para ingresar</div>
            <div id="role-selection">
                <button class="role-btn btn-student" onclick="showStudentForm()">🙋‍♂️ Soy Alumno</button>
                <button class="role-btn btn-teacher" onclick="showTeacherForm()">👨‍🏫 Soy Profesor</button>
            </div>
            <div id="form-student" class="auth-form">
                <input type="text" id="roomIdInput" class="auth-input" placeholder="CÓDIGO (4 DÍGITOS)" maxlength="4">
                <button class="role-btn btn-student" onclick="joinRoom()">Entrar a la Clase</button>
                <button class="back-btn" onclick="goBack()">Volver atrás</button>
            </div>
            <div id="form-teacher" class="auth-form">
                <input type="password" id="adminPin" class="auth-input" placeholder="INGRESA TU PIN">
                <button class="role-btn btn-teacher" onclick="verifyAdmin()">Acceder</button>
                <button class="back-btn" onclick="goBack()">Volver atrás</button>
            </div>
        </div>
    </div>

    <!-- Panel de Código Flotante -->
    <div id="ui-panel" class="floating-panel">
        <div id="status-text" style="font-size: 1.1em; color: #4ade80; font-weight:bold;">Iniciando sistema...</div>
        <div id="room-code-display" style="font-size: 2.5rem; letter-spacing: 6px; margin: 10px 0; font-weight:bold; color:#60a5fa; display:none;"></div>
        <div style="font-size: 0.85em; color: #cbd5e1;">El código se ocultará en 40 segundos</div>
    </div>

    <!-- Calculadora Científica/Gráfica (Desmos / Estilo ClassWiz) -->
    <div id="calc-panel" class="floating-panel">
        <div class="panel-header" id="calc-header">
            <span>🖩 Calculadora Gráfica Avanzada</span>
            <div class="panel-controls-header">
                <button onclick="toggleMaximize('calc-panel')" title="Pantalla Completa">🗖</button>
                <button onclick="toggleCalcMinimize()" title="Minimizar">_</button>
            </div>
        </div>
        <div class="pdf-controls">
            <button onclick="window.open('https://www.desmos.com/calculator?lang=es', '_blank', 'width=1000,height=800')" style="background:#2563eb;">🌐 Nueva Pestaña</button>
            <button onclick="captureCalcScreen()" style="background:#10b981;" title="Captura la gráfica actual para enviarla a la pizarra">📸 Capturar Gráfica</button>
        </div>
        <div id="calc-render-container" style="flex-grow: 1; display:flex; flex-direction:column; padding:0;">
            <iframe id="calc-frame" src="https://www.desmos.com/calculator?lang=es" style="width:100%; height:100%; flex-grow:1; border:none; background:#fff;"></iframe>
        </div>
        <div class="resize-handle resize-handle-panel" id="calc-resize-handle" title="Arrastra para redimensionar"></div>
    </div>

    <!-- Visor PDF -->
    <div id="pdf-panel" class="floating-panel">
        <div class="panel-header" id="pdf-header">
            <span>📄 Lector de PDF</span>
            <div class="panel-controls-header">
                <button onclick="toggleMaximize('pdf-panel')">🗖</button>
                <button onclick="togglePdfMinimize()">_</button>
            </div>
        </div>
        <div class="pdf-controls">
            <div class="pdf-controls-group">
                <button onclick="prevPage()" style="min-width:30px;">◀</button>
                <span style="font-size: 0.8rem;">Pág <b id="page-num">1</b></span>
                <button onclick="nextPage()" style="min-width:30px;">▶</button>
            </div>
            <div class="pdf-controls-group">
                <button onclick="zoomOut()" style="min-width:30px;">➖</button>
                <button onclick="zoomIn()" style="min-width:30px;">➕</button>
            </div>
            <button id="btn-crop-pdf" onclick="togglePdfCropMode()" style="background:#8b5cf6; padding: 6px 12px; border-radius: 8px;">✂️ Recortar</button>
        </div>
        <div id="pdf-render-container">
            <canvas id="pdf-canvas"></canvas>
            <div id="crop-overlay"><div id="crop-box"></div></div>
        </div>
        <div class="resize-handle resize-handle-panel" id="pdf-resize-handle" title="Arrastra para redimensionar"></div>
    </div>

    <!-- Visor Dola AI (Exclusivo Profesor) -->
    <div id="dola-panel" class="floating-panel">
        <div class="panel-header" id="dola-header">
            <span>🤖 Dola AI (Asistente Inteligente)</span>
            <div class="panel-controls-header">
                <button onclick="toggleMaximize('dola-panel')">🗖</button>
                <button onclick="toggleDolaMinimize()">_</button>
            </div>
        </div>
        <div class="pdf-controls">
            <button onclick="window.open('https://www.cici.com', '_blank', 'width=1000,height=800')" style="background:#2563eb;">🌐 Nueva Pestaña</button>
            <button onclick="captureDolaScreen()" style="background:#10b981;" title="Haz clic y selecciona la pestaña de Dola para recortar">📸 Capturar Pantalla</button>
        </div>
        <div id="dola-render-container" style="flex-grow: 1; display:flex; flex-direction:column; padding:0;">
            <iframe id="dola-frame" src="https://www.cici.com" style="width:100%; height:100%; flex-grow:1; border:none; background:#fff;"></iframe>
        </div>
        <div class="resize-handle resize-handle-panel" id="dola-resize-handle" title="Arrastra para redimensionar"></div>
    </div>

    <!-- Panel de Galería PERSISTENTE -->
    <div id="gallery-panel" class="floating-panel" style="width: 400px;">
        <div class="panel-header" id="gallery-header">
            <span>📁 Mis Ejercicios Guardados</span>
            <div class="panel-controls-header">
                <button onclick="toggleMaximize('gallery-panel')">🗖</button>
                <button onclick="toggleGalleryMinimize()">_</button>
            </div>
        </div>
        <div class="gallery-grid" id="gallery-grid-container">
            <!-- Contenido dinámico -->
        </div>
        <div class="resize-handle resize-handle-panel" id="gallery-resize-handle" title="Arrastra para redimensionar"></div>
    </div>

    <!-- WIDGET DE FÓRMULAS -->
    <div id="formulas-panel" class="floating-panel">
        <div class="panel-header" id="formulas-header">
            <span>🧮 Gran Biblioteca Matemática</span>
            <div class="panel-controls-header">
                <button onclick="toggleMaximize('formulas-panel')">🗖</button>
                <button onclick="toggleFormulasPanel()">_</button>
            </div>
        </div>
        <div class="formula-tab-btns">
            <button class="f-tab active" onclick="loadFormulas('algebra', this)">Álgebra</button>
            <button class="f-tab" onclick="loadFormulas('geometry', this)">Geometría</button>
            <button class="f-tab" onclick="loadFormulas('analytic_geometry', this)">G. Analítica</button>
            <button class="f-tab" onclick="loadFormulas('trigonometry', this)">Trigonometría</button>
            <button class="f-tab" onclick="loadFormulas('calculus', this)">Derivadas</button>
            <button class="f-tab" onclick="loadFormulas('integrals', this)">Integrales</button>
            <button class="f-tab" onclick="loadFormulas('stats', this)">Estadística</button>
            <button class="f-tab" onclick="loadFormulas('probability', this)">Probabilidad</button>
            <button class="f-tab" onclick="loadFormulas('topology', this)">Topología</button>
            <button class="f-tab" onclick="loadFormulas('physics', this)">Física</button>
        </div>
        <div id="formula-category-selector" class="formula-category-selector">
            <button class="f-cat" data-cat="arithmetic" onclick="selectFormulaCategory('arithmetic')">Aritmética</button>
            <button class="f-cat" data-cat="algebra" onclick="selectFormulaCategory('algebra')">Álgebra</button>
            <button class="f-cat" data-cat="geometry" onclick="selectFormulaCategory('geometry')">Geometría</button>
            <button class="f-cat" data-cat="analytic_geometry" onclick="selectFormulaCategory('analytic_geometry')">G. Analítica</button>
            <button class="f-cat" data-cat="trigonometry" onclick="selectFormulaCategory('trigonometry')">Trigonometría</button>
            <button class="f-cat" data-cat="calculus" onclick="selectFormulaCategory('calculus')">Derivadas</button>
            <button class="f-cat" data-cat="integrals" onclick="selectFormulaCategory('integrals')">Integrales ∫</button>
            <button class="f-cat" data-cat="statistics" onclick="selectFormulaCategory('statistics')">Estadística</button>
            <button class="f-cat" data-cat="probability" onclick="selectFormulaCategory('probability')">Probabilidad</button>
            <button class="f-cat" data-cat="topology" onclick="selectFormulaCategory('topology')">Topología</button>
            <button class="f-cat" data-cat="matrices" onclick="selectFormulaCategory('matrices')">Matrices</button>

    <div id="canvas-container">
        <canvas id="board"></canvas>
    </div>

<script>
        // Súper Script Unificado y Seguro (Restaurado Completo)
        window.toggleFullScreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        const peerNetworkOptions = { 
            config: { 
                'iceServers': [ 
                    { urls: 'stun:stun.l.google.com:19302' }, 
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ] 
            } 
        };
        let isAdmin = false; 
        let peer, connections = [], localStream = null;
        let audioContext, audioDestination;
        let userRole = 'Alumno'; 
        
        // Memoria Persistente de la Galería
        let savedCaptures = [];
        try {
            const stored = localStorage.getItem('mathboard_gallery');
            if(stored) savedCaptures = JSON.parse(stored);
        } catch(e) {}

        function showStudentForm() { document.getElementById('role-selection').style.display = 'none'; document.getElementById('form-student').style.display = 'block'; document.getElementById('login-msg').innerText = "Ingresa el código de la clase"; }
        function showTeacherForm() { document.getElementById('role-selection').style.display = 'none'; document.getElementById('form-teacher').style.display = 'block'; document.getElementById('login-msg').innerText = "Acceso seguro"; }
        function goBack() { document.getElementById('form-student').style.display = 'none'; document.getElementById('form-teacher').style.display = 'none'; document.getElementById('role-selection').style.display = 'block'; document.getElementById('login-msg').innerText = "Selecciona tu perfil"; document.getElementById('adminPin').value = ""; document.getElementById('roomIdInput').value = ""; }
        
        document.getElementById('adminPin')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyAdmin(); });
        document.getElementById('roomIdInput')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });

        async function getMicrophone() {
            if (!navigator.mediaDevices) return false;
            try { 
                localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, latency: 0.01 }, video: false }); 
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioDestination = audioContext.createMediaStreamDestination();
                audioContext.createMediaStreamSource(localStream).connect(audioDestination);
                return true; 
            } catch(e) { return false; }
        }

        // ================= SISTEMA DE AUDIO (VOZ) =================
        function playAudio(stream) {
            if (document.getElementById('audio-' + stream.id)) return; // Prevenir duplicación
            const audioEl = document.createElement('audio');
            audioEl.id = 'audio-' + stream.id;
            audioEl.srcObject = stream;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
            
            setTimeout(() => {
                audioEl.play().catch(err => {
                    console.warn("El navegador bloqueó el autoplay del audio:", err);
                });
            }, 100);
        }
        window.playAudio = playAudio;

        function toggleMic() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    const btn = document.getElementById('btn-mic');
                    if (btn) {
                        btn.innerHTML = audioTrack.enabled ? '🎙️' : '🔇';
                        btn.style.background = audioTrack.enabled ? 'transparent' : '#dc2626';
                    }
                }
            } else {
                alert("El micrófono no está activo.");
            }
        }
        window.toggleMic = toggleMic;
        // ==========================================================

        function verifyAdmin() {
            if (document.getElementById('adminPin').value === "1977$") {
                isAdmin = true;
                userRole = 'Profesor';
                document.getElementById('admin-tools').style.display = 'flex';
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('login-overlay').style.display = 'none', 500);
                createRoom();
                updateGalleryGrid();
            } else { alert("PIN Incorrecto."); }
        }

        function logoutSession() {
            if (confirm("¿Estás seguro de cerrar la sesión y finalizar la clase para todos?")) {
                if (isAdmin && typeof broadcastData === 'function') {
                    broadcastData({ type: 'logout' });
                }
                setTimeout(() => { window.location.reload(); }, 300);
            }
        }
        window.logoutSession = logoutSession;

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d', { desynchronized: true, alpha: false });
        
        ctx.lineCap = 'round'; 
        ctx.lineJoin = 'round';

        let internalWidth = window.innerWidth;
        let internalHeight = window.innerHeight;

        function drawGrid(targetCtx, w, h) {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(0, 0, w, h);
            targetCtx.strokeStyle = 'rgba(0,0,0,0.05)';
            targetCtx.lineWidth = 1.5;
            targetCtx.beginPath();
            for(let x=0; x<w; x+=35) { targetCtx.moveTo(x,0); targetCtx.lineTo(x,h); }
            for(let y=0; y<h; y+=35) { targetCtx.moveTo(0,y); targetCtx.lineTo(w,y); }
            targetCtx.stroke();
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            internalWidth = canvas.width;
            internalHeight = canvas.height;
            drawGrid(ctx, canvas.width, canvas.height);
        }

        function resizeCanvas() {
            const temp = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            internalWidth = canvas.width;
            internalHeight = canvas.height;
            
            drawGrid(ctx, canvas.width, canvas.height);
            
            const img = new Image();
            img.onload = () => {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.drawImage(img, 0, 0);
            };
            img.src = temp;
        }

        initCanvas();
        window.addEventListener('resize', resizeCanvas, { passive: true });

        // ===== MOTOR DE RED MULTIJUGADOR (Ultra-Baja Latencia vinculada a pantalla) =====
        let broadcastQueue = [];
        
        function broadcastLoop() {
            if(broadcastQueue.length > 0 && connections.length > 0) {
                const batch = { type: 'batch', data: broadcastQueue };
                connections.forEach(conn => { if(conn.open) conn.send(batch); });
                broadcastQueue = [];
            }
            requestAnimationFrame(broadcastLoop);
        }
        broadcastLoop();

        function broadcastData(data) { 
            data.peerId = peer ? peer.id : 'local';
            data.role = userRole;

            if(data.type === 'stroke' || data.type === 'draw' || data.type === 'shape') {
                broadcastQueue.push(data);
            } else {
                connections.forEach(conn => { if (conn.open) conn.send(data); }); 
            }
        }

        // ===== LIMPIEZA ABSOLUTA DE LA PIZARRA =====
        function clearCanvas() {
            if(!confirm('¿Limpiar toda la escritura de la pizarra por completo?')) return;
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            drawGrid(ctx, canvas.width, canvas.height);
            if(typeof window.saveState === 'function') window.saveState(); 
            broadcastData({ type:'clear' });
        }
        window.clearCanvas = clearCanvas;

        /* ================= BIBLIOTECA MATEMÁTICA DEFINITIVA ================= */
        const mathFormulas = {
            arithmetic: [
                {name:"Regla de tres simple",eq:"x = (b · c) / a"},
                {name:"Cálculo de porcentaje",eq:"P = (Parte / Total) · 100%"},
                {name:"Progresión Aritmética",eq:"aₙ = a₁ + (n - 1)d"},
                {name:"Suma de Progresión Aritmética",eq:"Sₙ = n · (a₁ + aₙ) / 2"},
                {name:"Progresión Geométrica",eq:"aₙ = a₁ · r^(n-1)"}
            ],
            algebra: [
                {name:"Cuadrado de suma",eq:"(a+b)² = a² + 2ab + b²"},
                {name:"Diferencia de cuadrados",eq:"a² - b² = (a - b)(a + b)"},
                {name:"Fórmula cuadrática",eq:"x = (-b ± √(b² - 4ac)) / (2a)"},
                {name:"Logaritmo del producto",eq:"log_b(x · y) = log_b(x) + log_b(y)"},
                {name:"Cambio de base",eq:"log_b(x) = ln(x) / ln(b)"}
            ],
            geometry: [
                {name:"Pitágoras",eq:"a²+b²=c²"},
                {name:"Área del círculo",eq:"A = π · r²"},
                {name:"Volumen de la esfera",eq:"V = (4/3) · π · r³"}
            ],
            analytic_geometry: [
                {name:"Distancia entre dos puntos",eq:"d = √((x₂ - x₁)² + (y₂ - y₁)²)"},
                {name:"Punto medio",eq:"M = ((x₁ + x₂)/2 , (y₁ + y₂)/2)"},
                {name:"Pendiente",eq:"m = (y₂ - y₁) / (x₂ - x₁)"}
            ],
            trigonometry: [
                {name:"Identidad pitagórica",eq:"sin²x + cos²x = 1"},
                {name:"Seno de la suma",eq:"sin(a ± b) = sin(a)cos(b) ± cos(a)sin(b)"},
                {name:"Ley de los senos",eq:"a / sin(A) = b / sin(B) = c / sin(C)"},
                {name:"Ley de los cosenos",eq:"c² = a² + b² - 2ab cos(C)"}
            ],
            calculus: [
                {name:"Definición de Derivada",eq:"f'(x) = lim(h→0) [f(x+h) - f(x)] / h"},
                {name:"Derivada de la potencia",eq:"d/dx [x^n] = n · x^(n-1)"},
                {name:"Regla de la cadena",eq:"[f(g(x))]' = f'(g(x)) · g'(x)"}
            ],
            integrals: [
                {name:"Integral de la potencia",eq:"∫ x^n dx = x^(n+1) / (n+1) + C"},
                {name:"Regla de Barrow",eq:"∫_a^b f(x)dx = F(b) - F(a)"},
                {name:"Integración por partes",eq:"∫ u dv = u·v - ∫ v du"}
            ],
            stats: [
                {name:"Media",eq:"x̄ = Σxᵢ / n"},
                {name:"Varianza",eq:"σ² = Σ(xᵢ - μ)² / N"},
                {name:"Desviación estándar",eq:"σ = √σ²"}
            ],
            probability: [
                {name:"Probabilidad",eq:"P(A) = Favorables / Posibles"},
                {name:"Teorema de Bayes",eq:"P(A|B) = [P(B|A)P(A)] / P(B)"}
            ],
            topology: [
                {name:"Característica de Euler",eq:"χ = V - E + F = 2"},
                {name:"Teorema Gauss-Bonnet",eq:"∫_M K dA + ∫_∂M k_g ds = 2πχ(M)"}
            ],
            matrices: [
                {name:"Determinante 2×2",eq:"det(A) = ad - bc"},
                {name:"Matriz inversa 2×2",eq:"A⁻¹ = (1 / det(A)) · [[d, -b], [-c, a]]"}
            ],
            vectors: [
                {name:"Producto escalar",eq:"u · v = u₁v₁ + u₂v₂ + u₃v₃"},
                {name:"Condición de perpendicularidad",eq:"u · v = 0"}
            ],
            complex: [
                {name:"Número complejo",eq:"z = a + bi"},
                {name:"Identidad de Euler",eq:"e^(iπ) + 1 = 0"}
            ],
            physics: [
                {name:"Segunda Ley de Newton",eq:"F = m · a"},
                {name:"Energía Cinética",eq:"E_k = (1/2)m · v²"},
                {name:"Ley de Ohm",eq:"V = I · R"}
            ]
        };

        function toggleFormulasPanel() {
            const panel = document.getElementById('formulas-panel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'flex';
                if(document.getElementById('formula-grid-container').innerHTML.trim() === '') {
                    loadFormulas('algebra', document.querySelector('.f-tab'));
                }
            } else {
                panel.style.display = 'none';
            }
        }
        window.toggleFormulasPanel = toggleFormulasPanel;

        let activeFormulaCategory = 'algebra';
        function loadFormulas(category, tabBtn) {
            activeFormulaCategory = category;
            document.querySelectorAll('.f-tab').forEach(btn => btn.classList.remove('active'));
            if (tabBtn) tabBtn.classList.add('active');
            renderFormulaList();
        }
        window.loadFormulas = loadFormulas;

        function renderFormulaList() {
            const grid = document.getElementById('formula-grid-container');
            const query = (document.getElementById('formula-search')?.value || '').trim().toLowerCase();
            const list = mathFormulas[activeFormulaCategory] || [];
            const filtered = list.filter(f => !query || f.name.toLowerCase().includes(query) || f.eq.toLowerCase().includes(query));
            grid.innerHTML = '';
            filtered.forEach((f) => {
                const wrap=document.createElement('div');
                wrap.className='formula-card';
                wrap.innerHTML=`<div class="formula-card-title">${f.name}</div><div class="formula-card-eq">${f.eq}</div>`;
                const actions=document.createElement('div');
                actions.className='formula-card-actions';
                const copy=document.createElement('button');
                copy.textContent='📋 Copiar';
                copy.onclick=()=>copyFormulaText(f.eq);
                const stamp=document.createElement('button');
                stamp.textContent='✏️ Pegar';
                stamp.onclick=()=>{ renderFormulaToStamp(f.eq); };
                actions.append(copy,stamp);
                wrap.appendChild(actions);
                grid.appendChild(wrap);
            });
        }
        window.renderFormulaList = renderFormulaList;

        function selectFormulaCategory(category){
            if(!mathFormulas[category]) return;
            activeFormulaCategory=category;
            renderFormulaList();
        }
        window.selectFormulaCategory = selectFormulaCategory;

        async function copyFormulaText(text) {
            try { await navigator.clipboard.writeText(text); alert('Copiado'); } catch(e){}
        }

        // ================= RUTINAS GALERÍA COMPRIMIDA PERSISTENTE =================
        function updateGalleryGrid() {
            const grid = document.getElementById('gallery-grid-container');
            if(savedCaptures.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:#888; padding:20px;">No hay capturas guardadas aún.<br>Usa el botón "💾 Guardar" para preservar ejercicios permanentemente.</div>';
                return;
            }
            grid.innerHTML = '';
            savedCaptures.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${src}">
                    <div style="display:flex; gap:5px;">
                        <button onclick="loadFromGallery(${idx})" style="background:#2563eb; flex:1; font-size:0.75rem; padding:4px;">✏️ Usar</button>
                        <button onclick="deleteFromGallery(${idx})" style="background:#dc2626; font-size:0.75rem; padding:4px;" title="Eliminar definitivamente">🗑️</button>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function deleteFromGallery(idx) {
            if(confirm('¿Eliminar esta captura guardada permanentemente?')) {
                savedCaptures.splice(idx, 1);
                try { localStorage.setItem('mathboard_gallery', JSON.stringify(savedCaptures)); } catch(e) {}
                updateGalleryGrid();
            }
        }
        window.deleteFromGallery = deleteFromGallery;

        function saveCurrentStampToGallery() {
            const img = document.getElementById('stamp-img');
            if(!img || !img.src) return;
            
            const tempImg = new Image();
            tempImg.onload = function() {
                const tcvs = document.createElement('canvas');
                const maxW = 1000; 
                const ratio = Math.min(1, maxW / tempImg.width);
                tcvs.width = tempImg.width * ratio;
                tcvs.height = tempImg.height * ratio;
                
                const tctx = tcvs.getContext('2d');
                tctx.fillStyle = '#ffffff';
                tctx.fillRect(0,0, tcvs.width, tcvs.height);
                tctx.drawImage(tempImg, 0, 0, tcvs.width, tcvs.height);
                
                const compressedSrc = tcvs.toDataURL('image/jpeg', 0.65);
                savedCaptures.unshift(compressedSrc);
                
                let saved = false;
                while(!saved && savedCaptures.length > 0) {
                    try { 
                        localStorage.setItem('mathboard_gallery', JSON.stringify(savedCaptures)); 
                        saved = true;
                    } catch(e) { 
                        savedCaptures.pop();
                    }
                }
                if(saved) alert("¡Captura guardada! Estará disponible incluso si cierras la ventana.");
                updateGalleryGrid();
            };
            tempImg.src = img.src;
        }
        window.saveCurrentStampToGallery = saveCurrentStampToGallery;

        function loadFromGallery(idx) {
            const src = savedCaptures[idx];
            if(!src) return;
            const img = document.getElementById('stamp-img');
            const source = new Image();
            source.onload = function() {
                let w = source.naturalWidth || source.width; let h = source.naturalHeight || source.height;
                const ratio = Math.min(1, 900 / w, 650 / h);
                w = Math.max(80, Math.round(w * ratio)); h = Math.max(60, Math.round(h * ratio));
                img.onload = function() {
                    const sc = document.getElementById('stamper-content');
                    sc.style.width = w + 'px'; sc.style.height = h + 'px';
                    const stamper = document.getElementById('stamper');
                    stamper.style.top = (window.innerHeight/2) + 'px';
                    stamper.style.left = (window.innerWidth/2) + 'px';
                    stamper.style.display = 'block';
                };
                img.src = src;
            };
            source.src = src;
            toggleGalleryMinimize();
        }
        window.loadFromGallery = loadFromGallery;

        function toggleGalleryPanel() {
            const panel = document.getElementById('gallery-panel');
            panel.style.display = panel.style.display === 'none' || panel.style.display === '' ? 'flex' : 'none';
        }
        window.toggleGalleryPanel = toggleGalleryPanel;
        function toggleGalleryMinimize() { document.getElementById('gallery-panel').style.display = 'none'; }
        window.toggleGalleryMinimize = toggleGalleryMinimize;

        // ================= STAMPER Y PEGAR EN PIZARRA =================
        function renderFormulaToStamp(formulaText) {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tCtx.font = 'bold 40px serif';
            const metrics = tCtx.measureText(formulaText);
            const width = Math.ceil(metrics.width + 60);
            const height = 100;
            tempCanvas.width = width; tempCanvas.height = height;
            tCtx.font = 'bold 40px serif';
            tCtx.textBaseline = 'middle'; tCtx.textAlign = 'center';
            tCtx.fillStyle = document.getElementById('mw-color').value || '#0f172a';
            tCtx.fillText(formulaText, width / 2, height / 2);

            const img = document.getElementById('stamp-img');
            img.src = tempCanvas.toDataURL('image/png');
            const stamperContent = document.getElementById('stamper-content');
            stamperContent.style.width = width + 'px'; stamperContent.style.height = height + 'px';
            const stamper = document.getElementById('stamper');
            stamper.style.display = 'block';
            
            stamper.style.top = (window.innerHeight/2) + 'px';
            stamper.style.left = (window.innerWidth/2) + 'px';
            
            document.getElementById('formulas-panel').style.display = 'none';
        }

        function applyStamp() {
            const img = document.getElementById('stamp-img');
            const rect = document.getElementById('stamper-content').getBoundingClientRect();
            
            const scaleX = canvas.width / window.innerWidth;
            const scaleY = canvas.height / window.innerHeight;
            
            const realX = rect.left * scaleX; 
            const realY = rect.top * scaleY;

        let mediaRecorder; let recordedChunks = []; let isRecording = false;

        function toggleRecording() { if (!isRecording) startRecording(); else stopRecording(); }

        function startRecording() {
            if (!audioDestination) { alert("Audio no inicializado."); return; }
            const canvasStream = canvas.captureStream(60); // 60 FPS garantizados para fluidez nativa
            let combinedStream;
            if(audioDestination && audioDestination.stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream([ ...canvasStream.getVideoTracks(), ...audioDestination.stream.getAudioTracks() ]);
            } else {
                combinedStream = canvasStream;
            }
            
            const options = { mimeType: 'video/webm;codecs=h264', videoBitsPerSecond: 4000000 }; 
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm;codecs=vp9';
                if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(combinedStream, options);
            mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                cancelAnimationFrame(recordingLoop); 
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'Clase_MathBoard.mp4'; a.click();
                URL.revokeObjectURL(url); recordedChunks = [];
            };
            mediaRecorder.start(); isRecording = true;
            document.getElementById('btn-record').classList.add('record-active');

            // MOTOR ANTI-DESFASE DE AUDIO/VIDEO
            function keepRecordingAlive() {
                if (!isRecording) return;
                const c = canvas.getContext('2d', { desynchronized: true, alpha: false });
                c.fillStyle = '#ffffff';
                c.fillRect(0, 0, 1, 1);
                recordingLoop = requestAnimationFrame(keepRecordingAlive);
            }
            keepRecordingAlive();
        }

            mediaRecorder.stop();

        function updateRemoteCursor(data) {
            if (!data.peerId) return;
            let cursor = document.getElementById('cursor-' + data.peerId);
            if (!cursor) {
                cursor = document.createElement('div');
                cursor.id = 'cursor-' + data.peerId;

                document.getElementById('canvas-container').appendChild(cursor);
            }
            
            const realX = (data.lastPosX || data.x) * canvas.width;
            const realY = (data.lastPosY || data.y) * canvas.width;
            
            cursor.style.transform = `translate(${realX}px, ${realY}px)`;
            cursor.querySelector('.cursor-dot').style.backgroundColor = data.color || '#3b82f6';
            cursor.querySelector('.cursor-label').style.backgroundColor = data.role === 'Profesor' ? '#10b981' : '#2563eb';
            
            clearTimeout(cursor.timeout);
            cursor.style.opacity = '1';
            cursor.timeout = setTimeout(() => { cursor.style.opacity = '0'; }, 600);
        }

        function drawShapeExact(targetCtx, type, x1, y1, x2, y2, color, size) {
            targetCtx.save();
            targetCtx.lineCap = 'round'; targetCtx.lineJoin = 'round';
            targetCtx.globalCompositeOperation = 'source-over';
            targetCtx.strokeStyle = color; targetCtx.lineWidth = size;
            const w = x2 - x1; const h = y2 - y1;
            targetCtx.beginPath();
            if (type === 'line' || type === 'arrow') {
                targetCtx.moveTo(x1, y1); targetCtx.lineTo(x2, y2); targetCtx.stroke();
                if (type === 'arrow') drawArrowHead(targetCtx, x1, y1, x2, y2, size);
            } else if (type === 'rect') {
                targetCtx.strokeRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(w), Math.abs(h));
            } else if (type === 'circle') {
                const r = Math.hypot(w, h); targetCtx.arc(x1, y1, r, 0, 2*Math.PI); targetCtx.stroke();
            }
            targetCtx.restore();
        }

        function drawArrowHead(ctxT, x1, y1, x2, y2, size) {
            const angle = Math.atan2(y2-y1, x2-x1); const head = Math.max(15, size * 3);
            ctxT.beginPath(); ctxT.moveTo(x2, y2);
            ctxT.lineTo(x2 - head*Math.cos(angle-Math.PI/6), y2 - head*Math.sin(angle-Math.PI/6));
            ctxT.moveTo(x2, y2);
            ctxT.lineTo(x2 - head*Math.cos(angle+Math.PI/6), y2 - head*Math.sin(angle+Math.PI/6));
            ctxT.stroke();
        }

        function processRemoteCommand(data) {
            if (data.type === 'clear') { 
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                drawGrid(ctx, canvas.width, canvas.height); 
                return; 
            }
            if (data.type === 'logout') {
                alert("El profesor ha finalizado y cerrado la sesión.");
                window.location.reload();
                return;
            }
            
            if (data.type === 'start') { 
                updateRemoteCursor(data);
                return; 
            }
            if (data.type === 'stop') { return; }
            if (data.type === 'image') {
                const img = new Image();
                img.onload = () => { ctx.globalAlpha=1; ctx.drawImage(img, data.x * canvas.width, data.y * canvas.width, data.w * canvas.width, data.h * canvas.width); };
                img.src = data.src; return;
            }
            if (data.type === 'shape') {
                drawShapeExact(ctx, data.shape, data.x1 * canvas.width, data.y1 * canvas.width, data.x2 * canvas.width, data.y2 * canvas.width, data.color, data.size * canvas.width);
                return;
            }
            if (data.type === 'stroke') {
                updateRemoteCursor(data);
                
                const finalSize = data.size * canvas.width;
                ctx.beginPath();
                ctx.moveTo(data.lastMidX * canvas.width, data.lastMidY * canvas.width);
                ctx.quadraticCurveTo(data.lastPosX * canvas.width, data.lastPosY * canvas.width, data.midX * canvas.width, data.midY * canvas.width);

                ctx.lineWidth = finalSize;
                if(data.tool === 'eraser'){
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = '#ffffff';
                    ctx.globalAlpha = 1;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = data.color;
                    ctx.globalAlpha = data.tool === 'marker' ? 0.38 : 0.92;
                }
                ctx.stroke();
            }
        }

        let remoteRenderQueue = [];
        let isRemoteRendering = false;
        
        function drawRemote(data) {
            if (data.type === 'batch') {
                for(let i=0; i<data.data.length; i++) processRemoteCommand(data.data[i]);
            } else {
                processRemoteCommand(data);
            }
            
            // RE-TRANSMISIÓN PARA MÚLTIPLES ALUMNOS: 
            // Si soy el profesor y recibo un trazo de un alumno, se lo reenvío a los demás.
            if (isAdmin) {
                connections.forEach(conn => {
                    if (conn.open && conn.peer !== data.peerId) {
                        conn.send(data);
                    }
                });
            }
        }

            // PREFIJO DE SEGURIDAD: Evita que el servidor público de PeerJS cruce tu sala con la de otros en el mundo
            peer = new Peer('MBPRO_' + randomCode, peerNetworkOptions);
            
            peer.on('open', (id) => {
                // Solo ocultar login cuando el servidor nos asignó el ID exitosamente
                document.getElementById('login-overlay').style.opacity = '0';

                        setTimeout(() => uiPanel.style.display = 'none', 1000); 
                    }
                }, 40000); 
            });

            peer.on('connection', (conn) => { 
                connections.push(conn); 
                conn.on('data', drawRemote); 
            });

            peer.on('call', (call) => { 
                if(localStream) call.answer(localStream); else call.answer(); 
                call.on('stream', playAudio); 
            });

            peer.on('error', (err) => {
                console.error("Error del Profesor:", err);
                if (err.type === 'unavailable-id') {
                    alert("Error de red. Ese código está atascado en el servidor. Recargando...");
                    window.location.reload();
                }
            });
        }

        async function joinRoom() {
            const roomIdInput = document.getElementById('roomIdInput');
            const roomId = roomIdInput.value.toUpperCase().trim();
            if (!roomId || roomId.length !== 4) return alert("Ingresa un código válido de 4 dígitos.");
            
            // UX: Mostrar al usuario que está conectando
            const btn = document.querySelector('#form-student .btn-student');
            const originalText = btn.innerText;
            btn.innerText = "Conectando al Profesor...";
            btn.disabled = true;

            await getMicrophone();
            peer = new Peer(peerNetworkOptions);
            
            peer.on('open', () => {
                const targetId = 'MBPRO_' + roomId;
                // Reliable: true forza a WebRTC a usar un canal más estable para la pizarra
                const conn = peer.connect(targetId, { reliable: true }); 
                
                // ESPERAR AL EVENTO 'open' REAL con el profesor
                conn.on('open', () => {
                    connections.push(conn);
                    conn.on('data', drawRemote);
                    
                    document.getElementById('login-overlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('login-overlay').style.display = 'none', 500);
                    document.getElementById('main-toolbar').style.display = 'flex';
                    
                    // MEJORA: Pequeño retraso de 1000ms para asegurar conexión limpia antes de enviar voz
                    setTimeout(() => {
                        if(localStream) { 
                            const call = peer.call(targetId, localStream); 
                            if(call) call.on('stream', playAudio); 
                        }
                    }, 1000);
                });
            });

            peer.on('error', (err) => {
                console.error("Error del Alumno:", err);
                btn.innerText = originalText;
                btn.disabled = false;
                
                if (err.type === 'peer-unavailable') {
                    alert("No se encontró al profesor. Verifica que el código sea correcto y que el profesor ya esté en la pizarra.");
                } else if (err.type === 'network' || err.type === 'server-error') {
                    alert("Falla en el servidor PeerJS. Intenta de nuevo.");
                }
            });
        }

        // ================= SISTEMA DE VENTANAS FLOTANTES Y REDIMENSIÓN =================
        function disableIframes() { document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none'); }
        function enableIframes() { document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'auto'); }

        function makeDraggable(element, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            handle.addEventListener('pointerdown', dragMouseDown);
            function dragMouseDown(e) { 
                if(e.target.tagName === 'BUTTON') return;
                e.preventDefault(); 
                pos3 = e.clientX; pos4 = e.clientY; 
                disableIframes(); 
                document.addEventListener('pointerup', closeDragElement); 
                document.addEventListener('pointermove', elementDrag); 
            }
            function elementDrag(e) { 
                e.preventDefault(); 
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; 
                pos3 = e.clientX; pos4 = e.clientY; 
                element.style.top = (element.offsetTop - pos2) + "px"; 
                element.style.left = (element.offsetLeft - pos1) + "px"; 
            }
            function closeDragElement() { 
                document.removeEventListener('pointerup', closeDragElement); 
                document.removeEventListener('pointermove', elementDrag); 
                enableIframes(); 
            }
        }
        
        function makePanelResizable(panelId, handleId) {
            const panel = document.getElementById(panelId);
            const handle = document.getElementById(handleId);
            if(!panel || !handle) return;
            let isR = false, sW, sH, sX, sY;
            handle.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                isR = true; sW = panel.offsetWidth; sH = panel.offsetHeight;
                sX = e.clientX; sY = e.clientY;
                disableIframes();
            });
            window.addEventListener('pointermove', e => {
                if(!isR) return;
                let newW = sW + e.clientX - sX;
                let newH = sH + e.clientY - sY;
                if(newW > 200) panel.style.width = newW + 'px';
                if(newH > 150) {
                    panel.style.height = newH + 'px';
                    panel.style.maxHeight = 'none'; 
                    const container = panel.querySelector('div[id$="-render-container"]');
                    if(container) { container.style.maxHeight = 'none'; container.style.height = '100%'; }
                }
            });
            window.addEventListener('pointerup', () => { if(isR) { isR = false; enableIframes(); } });
        }

        function toggleMaximize(panelId) {
            const panel = document.getElementById(panelId);
            if (!panel) return;
            if (panel.dataset.maximized === 'true') {
                panel.style.width = panel.dataset.w;
                panel.style.height = panel.dataset.h;
                panel.style.top = panel.dataset.t;
                panel.style.left = panel.dataset.l;
                panel.dataset.maximized = 'false';
            } else {
                panel.dataset.w = panel.style.width || panel.offsetWidth + 'px';
                panel.dataset.h = panel.style.height || panel.offsetHeight + 'px';
                panel.dataset.t = panel.style.top || panel.offsetTop + 'px';
                panel.dataset.l = panel.style.left || panel.offsetLeft + 'px';
                
                panel.style.width = '100vw';
                panel.style.height = '100vh';
                panel.style.top = '0px';
                panel.style.left = '0px';
                panel.style.maxHeight = 'none';
                const container = panel.querySelector('div[id$="-render-container"]');
                if(container) { container.style.maxHeight = 'none'; container.style.height = '100%'; }
                panel.dataset.maximized = 'true';
            }
        }
        window.toggleMaximize = toggleMaximize;

        makeDraggable(document.getElementById('pdf-panel'), document.getElementById('pdf-header'));
        makeDraggable(document.getElementById('dola-panel'), document.getElementById('dola-header'));
        makeDraggable(document.getElementById('calc-panel'), document.getElementById('calc-header'));
        makeDraggable(document.getElementById('formulas-panel'), document.getElementById('formulas-header'));
        makeDraggable(document.getElementById('gallery-panel'), document.getElementById('gallery-header'));
        makeDraggable(document.getElementById('stamper'), document.getElementById('stamper-header'));

        makePanelResizable('pdf-panel', 'pdf-resize-handle');
        makePanelResizable('dola-panel', 'dola-resize-handle');
        makePanelResizable('calc-panel', 'calc-resize-handle');
        makePanelResizable('gallery-panel', 'gallery-resize-handle');
        makePanelResizable('formulas-panel', 'formulas-resize-handle');

        // Redimensión de estampas
        const resizeHandleStamper = document.getElementById('resize-handle');
        const stamperContent = document.getElementById('stamper-content');
        let isResizingStamp = false, startStampW, startStampH, startStampX, startStampY;
        
        resizeHandleStamper.addEventListener('pointerdown', (e) => {
            e.preventDefault(); e.stopPropagation();
            isResizingStamp = true;
            startStampW = stamperContent.offsetWidth;
            startStampH = stamperContent.offsetHeight;
            startStampX = e.clientX;
            startStampY = e.clientY;
        });
        
        window.addEventListener('pointermove', (e) => {
            if (!isResizingStamp) return;
            const diffX = e.clientX - startStampX;
            const ratio = startStampW / startStampH;
            let newW = startStampW + diffX;
            let newH = newW / ratio;
            
            if (newW > 50) {
                stamperContent.style.width = newW + 'px';
                stamperContent.style.height = newH + 'px';
            }
        });
        
        window.addEventListener('pointerup', () => { isResizingStamp = false; });
</script>

<script>
/* === MOTOR UNIVERSAL DE ESCRITURA (RENDERIZADO RAF HIPER-FLUIDO) === */
(function(){
  const board = document.getElementById('board');
  if(!board) return;

  let mwMode = 'pen';
  let mwSize = 5;
  let mwDrawing = false;
  
  let mwLastPosX = 0, mwLastPosY = 0;
  let mwLastMidX = 0, mwLastMidY = 0;
  
  let shapeStartX = 0, shapeStartY = 0;
  const shapePreviewCanvas = document.createElement('canvas');

  let renderQueue = [];
  let isRendering = false;

  function processRenderQueue() {
      if(renderQueue.length === 0) {
          isRendering = false;
          return;
      }
      
      const c = board.getContext('2d', {desynchronized: true, alpha: false});
      c.lineCap = 'round'; c.lineJoin = 'round';
      
      const batch = renderQueue.splice(0, renderQueue.length);
      for(let i=0; i<batch.length; i++) {
          let pt = batch[i];
          c.beginPath();
          c.moveTo(pt.lastMidX, pt.lastMidY);
          c.quadraticCurveTo(pt.lastPosX, pt.lastPosY, pt.midX, pt.midY);

          c.lineWidth = pt.size;
          if(pt.tool === 'eraser'){
              c.globalCompositeOperation = 'source-over';
              c.strokeStyle = '#ffffff';
              c.globalAlpha = 1;
          } else {
              c.globalCompositeOperation = 'source-over';
              c.strokeStyle = pt.color;
              c.globalAlpha = pt.tool === 'marker' ? 0.38 : 0.92;
          }
          c.stroke();
      }
      
      requestAnimationFrame(processRenderQueue);
  }

  function queueStroke(lastMidX, lastMidY, lastPosX, lastPosY, midX, midY, size, tool, color) {
      renderQueue.push({ lastMidX, lastMidY, lastPosX, lastPosY, midX, midY, size, tool, color });
      if(!isRendering) {
          isRendering = true;
          requestAnimationFrame(processRenderQueue);
      }
  }

  function pos(ev){ return { x: ev.clientX, y: ev.clientY }; }

  function saveState(){
    try{
      if(window.mwUndo && window.mwUndo.length > 12) window.mwUndo.shift();
      if(!window.mwUndo) window.mwUndo = [];
      window.mwUndo.push(board.toDataURL('image/png'));
    }catch(e){}
  }
  window.saveState = saveState;

  function restoreData(url){
    const img = new Image();
    img.onload = function(){
      const c = board.getContext('2d');
      c.fillStyle = '#ffffff';
      c.fillRect(0,0,board.width,board.height);
      drawGrid(c, board.width, board.height);
      c.drawImage(img,0,0);
    };
    img.src = url;
  }

  function setMode(mode){
    mwMode = mode;
    ['mw-pen','mw-marker','mw-line','mw-arrow','mw-rect','mw-circle','mw-eraser'].forEach(id=>{
      const b=document.getElementById(id);
      if(b) b.classList.toggle('active', id.replace('mw-','') === mode);
    });
  }
  
  function start(ev){
    if(ev.target.tagName === 'BUTTON' || ev.target.tagName === 'INPUT' || ev.target.closest('.floating-panel') || ev.target.closest('#main-toolbar')) return;
    ev.preventDefault();
    saveState();

    mwDrawing = true;
    const p = pos(ev);
    mwLastPosX = p.x; mwLastPosY = p.y;
    mwLastMidX = p.x; mwLastMidY = p.y;

    if (['line','arrow','rect','circle'].includes(mwMode)) {
        shapeStartX = p.x; shapeStartY = p.y;
        shapePreviewCanvas.width = canvas.width; shapePreviewCanvas.height = canvas.height;
        shapePreviewCanvas.getContext('2d').drawImage(canvas, 0, 0);
    } else {
        if (typeof broadcastData === 'function') {
            broadcastData({ type:'start' });
        }
    }
    try{ board.setPointerCapture(ev.pointerId); }catch(e){}
  }

  function move(ev){
    if(!mwDrawing) return;
    ev.preventDefault();
    
    const events = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    const inkColor = document.getElementById('mw-color').value;

    if (['line','arrow','rect','circle'].includes(mwMode)) {
        let p = pos(events[events.length - 1]);
        const c = board.getContext('2d');
        c.fillStyle = '#ffffff';
        c.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid(c, canvas.width, canvas.height);
        c.drawImage(shapePreviewCanvas, 0, 0);
        drawShapeExact(c, mwMode, shapeStartX, shapeStartY, p.x, p.y, inkColor, mwSize);
        mwLastPosX = p.x; mwLastPosY = p.y;
        return; 
    }

    for (let i=0; i<events.length; i++) {
        let e = events[i];
        let p = pos(e);
        
        let rawPressure = e.pointerType === 'pen' ? e.pressure : 0.5;
        if (rawPressure === 0) rawPressure = 0.5; 

        let pFactor = e.pointerType === 'pen' ? (0.3 + (rawPressure * rawPressure) * 1.2) : 1;
        let baseSize = mwMode === 'marker' ? Math.max(12, mwSize * 2.2) : mwSize;
        let finalSize = mwMode === 'eraser' ? Math.max(30, mwSize * 6) : baseSize * pFactor;
        
        let midX = (mwLastPosX + p.x) * 0.5;
        let midY = (mwLastPosY + p.y) * 0.5;

        queueStroke(mwLastMidX, mwLastMidY, mwLastPosX, mwLastPosY, midX, midY, finalSize, mwMode, inkColor);

        if (typeof broadcastData === 'function') {
            broadcastData({ 
                type:'stroke', 
                lastMidX: mwLastMidX / canvas.width, lastMidY: mwLastMidY / canvas.width, 
                lastPosX: mwLastPosX / canvas.width, lastPosY: mwLastPosY / canvas.width, 
                midX: midX / canvas.width, midY: midY / canvas.width, 
                color: inkColor, size: finalSize / canvas.width, tool: mwMode 
            });
        }

        mwLastPosX = p.x;
        mwLastPosY = p.y;
        mwLastMidX = midX;
        mwLastMidY = midY;
    }
  }

  function end(ev){
    if(!mwDrawing) return;
    ev.preventDefault();
    mwDrawing=false;
    
    if (['line','arrow','rect','circle'].includes(mwMode)) {
        if (typeof broadcastData === 'function') {
            broadcastData({ 
                type: 'shape', shape: mwMode,
                x1: shapeStartX / canvas.width, y1: shapeStartY / canvas.width,
                x2: mwLastPosX / canvas.width, y2: mwLastPosY / canvas.width,
                color: document.getElementById('mw-color').value, size: mwSize / canvas.width 
            });
        }
    } else {
        if (typeof broadcastData === 'function') broadcastData({ type:'stop' });
    }
    try{ board.releasePointerCapture(ev.pointerId); }catch(e){}
  }

  board.addEventListener('pointerdown', start, {passive:false});
  board.addEventListener('pointermove', move, {passive:false});
  board.addEventListener('pointerup', end, {passive:false});
  board.addEventListener('pointercancel', end, {passive:false});
  board.addEventListener('contextmenu', e=>e.preventDefault());

  ['mw-pen','mw-marker','mw-line','mw-arrow','mw-rect','mw-circle','mw-eraser'].forEach(id=>{
      const btn = document.getElementById(id);
      if(btn) btn.addEventListener('click',()=>setMode(id.replace('mw-','')));
  });
  
  const color = document.getElementById('mw-color');
  color && color.addEventListener('input', e => { setMode('pen'); });
  
  const size = document.getElementById('mw-size');
  size && size.addEventListener('input',e=>mwSize=+e.target.value);
  
  const undoBtn = document.getElementById('mw-undo');
  undoBtn && undoBtn.addEventListener('click',()=>{
    if(window.mwUndo && window.mwUndo.length > 0) {
        const last = window.mwUndo.pop();
        restoreData(last);
        if (typeof broadcastData === 'function') broadcastData({ type: 'image', src: last, x: 0, y: 0, w: 1, h: canvas.height/canvas.width });
    }
  });

  const clearBtn = document.getElementById('mw-clear');
  clearBtn && clearBtn.addEventListener('click',()=>{ if(typeof clearCanvas === 'function') clearCanvas(); });
})();
</script>
